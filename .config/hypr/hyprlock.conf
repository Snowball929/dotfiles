# INPUT FIELD
input-field {
    monitor = DP-1
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = FiraMono Nerd Font Propo
    placeholder_text = <span foreground="##ffffff99">🔒 Enter Pass</span>
    fail_text = $FAIL
    check_color = rgba(255,130,0,1)
    fail_color = rgba(255,0,0,1)
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}


