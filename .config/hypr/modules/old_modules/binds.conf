###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = dolphin --platformtheme kde
$menu = wofi --show drun
$menurun = wofi --show run

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, bracketright, exec, hyprshot -m region --freeze
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = , Print, exec, hyprshot -m region --freeze

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, F, exec, firefox
bind = $mainMod, X, fullscreen
#bind = $mainMod, S, exec, steam
#bind = $mainMod, V, exec, cliphist list | wofi -S dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy && wtype -M ctrl -k v -m ctrl
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy && wtype -M ctrl -k v -m ctrl
bind = $mainMod, D, exec, ~/appImages/Vesktop-1.6.5.AppImage
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, N, exec, swaync-client -t -sw,
bind = $mainMod, Z, exec, swaync-client -t -sw,
bind = $mainMod, L, exec, hyprlock
# bind = $mainMod, E, exec, gio launch /home/snow/.local/share/applications/spf.desktop
bind = $mainMod, S, exec, gio launch /home/snow/.local/share/applications/spf.desktop
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, K, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, $menurun
#bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, J, layoutmsg, swapsplit # dwindle
bind = $mainMod SHIFT, T, exec, ~/Documents/scripts/killHyprshot.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left,exec, ~/Documents/scripts/movingL.sh
bind = $mainMod, right, exec, ~/Documents/scripts/movingR.sh
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, moveactive, -100 0
bind = $mainMod SHIFT, right, moveactive, 100 0
bind = $mainMod SHIFT, up, moveactive, 0 -100
bind = $mainMod SHIFT, down, moveactive, 0 100
bind = $mainMod SHIFT, T, moveactive, 500 0

#scrolling moving columns
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, up, swapwindow, u


#resizing binds top are dwindle, bottom two are scrolling
#binde = $mainMod ALT, left, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch resizeactive -200 0 ; keyword misc:animate_manual_resizes false"
#binde = $mainMod ALT, right, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch resizeactive 200 0 ; keyword misc:animate_manual_resizes false"
binde = $mainMod ALT, up, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch resizeactive 0 -200 ; keyword misc:animate_manual_resizes false"
binde = $mainMod ALT, down, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch resizeactive 0 200 ; keyword misc:animate_manual_resizes false"

#resizing scripts for layout addressing
binde = $mainMod ALT, right, exec, ~/Documents/scripts/resizingR.sh
binde = $mainMod ALT, left, exec, ~/Documents/scripts/resizingL.sh
#binde = $mainMod ALT, left, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch layoutmsg colresize -0.1 ; keyword misc:animate_manual_resizes false"
#binde = $mainMod ALT, right, exec, hyprctl --batch "keyword misc:animate_manual_resizes true ; dispatch layoutmsg colresize +0.1 ; keyword misc:animate_manual_resizes false"
bind = $mainMod, space, layoutmsg, promote



# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = ALT, TAB, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace without focus change
bind = $mainMod CONTROL, 1, movetoworkspacesilent, 1
bind = $mainMod CONTROL, 2, movetoworkspacesilent, 2
bind = $mainMod CONTROL, 3, movetoworkspacesilent, 3
bind = $mainMod CONTROL, 4, movetoworkspacesilent, 4
bind = $mainMod CONTROL, 5, movetoworkspacesilent, 5
bind = $mainMod CONTROL, 6, movetoworkspacesilent, 6
bind = $mainMod CONTROL, 7, movetoworkspacesilent, 7
bind = $mainMod CONTROL, 8, movetoworkspacesilent, 8
bind = $mainMod CONTROL, 9, movetoworkspacesilent, 9
bind = $mainMod CONTROL, 0, movetoworkspacesilent, 10

#discord mutes
# bind = $mainMod, backslash, focuswindow, class:^(vesktop)$
bind = $mainMod, backslash,sendshortcut,CTRL SHIFT,M, class:^(vesktop)$
# bind = $mainMod, backslash, focuscurrentorlast

#obs binding
bind = $mainMod, equal, pass, class:^(com\.obsproject\.Studio)$


# Example special workspace (scratchpad)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, mouse_down, movefocus, l
bind = $mainMod, mouse_up, movefocus, r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = SHIFT,XF86AudioMute, exec, ~/Documents/scripts/pactlScript.sh

bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
binds{
	scroll_event_delay=0
}
