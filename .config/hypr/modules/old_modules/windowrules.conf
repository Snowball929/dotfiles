#moves all games to workspace 2 and removes blur
windowrule {
  name = windowrule-6
  workspace = 2
  no_blur = on
  match:tag = games*
  fullscreen = true
}

# Ignore maximize requests from apps. You'll probably like this. Idk man i guess
windowrule {
  name = windowrule-7
  suppress_event = maximize
  match:class = .*
}

# Fix some dragging issues with XWayland apparently
windowrule {
  name = windowrule-8
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}
#default, unsure
windowrule {
  name = windowrule-9
  opaque = on
  no_shadow = on
  no_blur = on
  match:title = ()
}
#default, unsure
windowrule {
  name = windowrule-10
  opaque = on
  no_shadow = on
  no_blur = on
  match:class = ()
}

#workspace 5 and up are opaque
windowrule {
  name = windowrule-11
  opacity = 1 override 1 override 1.0 override
  
  match:workspace = r[5-9]
}
#makes zotero pop-up float
windowrule {
  name = windowrule-13
  float = on
  match:class = (Zotero)
}
#stops main zotero floating
windowrule {
  name = windowrule-14
  float = off
  match:title = (Zotero)
}

#positions volume control in corner and size correctly 
windowrule {
  name = windowrule-16
  float = on
  size = 650 700
  move = 1903 55
  match:title = (Volume Control)
  match:workspace = m[DP-1]
}

windowrule {
  name = windowrule-17
  float = on
  size = 650 700
  move = 1264 55
  match:title = (Volume Control)
  match:workspace = m[HDMI-A-1]
}

#floats kcalc on mouse postion
windowrule {
  name = windowrule-18
  float = on
  size = 400 500
  move = (cursor_x-200) (cursor_y-250)
  match:title = (KCalc)
}

#enables transparency on superfile when in use
windowrule {
  name = windowrule-20
  opacity = 0.9 override 0.7 override 0.7 override
  match:title = (superfile)
}



#stops ltspice floating
windowrule {
  name = windowrule-21
  float = off
  match:title = (LTspice)
}


#steam properties now floats 
windowrule {
  name = windowrule-22
  float = on
  center = on
  match:title = negative:Steam
  match:class = (steam)
  
}
#stops drop downs in steam from floating 
windowrule {
  name = windowrule-23
  float = on
  center = off
  match:title = ^$
  match:class = (steam)
  
}
#forces friends list to float below mouse
windowrule {
  name = windowrule-24
  float = on
  size = 400 500
  move = (cursor_x-200) (cursor_y+30)
  
  match:title = (Friends List)
}
#forces screenshare prompt to float above mouse
windowrule {
  name = windowrule-25
  float = on
  size = 500 290
  move = (cursor_x-100) (cursor_y-320)
  match:class = (hyprland-share-picker)
}
#changes PNG and JPEG export window in GIMP to be floating and centered
windowrule {
  name = windowrule-26
  float = on
  center = on
  match:title = Export Image as PNG|Export Image as JPEG|Export Image as WebP|Preferences
  match:class = file-png|file-jpeg|file-webp|gimp
  
}

#moves discord to workspace 3 on startup
windowrule {
  name = windowrule-27
  workspace = 3
  match:class = vesktop
}
#moves steam to workspace 1 on startup
windowrule {
  name = windowrule-27-1
  workspace = 1
  match:class = steam
  match:title = Steam|Sign in to Steam
}

#ensures that fullscreen of voice call is opaque 
windowrule {
  name = windowrule-28
  opacity = 1.0 override 1.0 override 1.0 override
  match:title = ^(.*Discord \| General.*)$|^(.*Discord \| morbuis.*)$

}

#forces calendar to be small
windowrule {
  name = windowrule-29
  float = on
  size = 650 540
  match:class = org.kde.korganizer
}
#forces youtube videos to be opaque
windowrule {
  name = windowrule-30
  opacity = 1.0 override 1.0 override 1.0 override
  match:title = ^(.*YouTube.*)$|^(.*Netflix.*)$
}

#centers steamvr and gives it a distinct border, not like ill be seeing it
windowrule {
  name = windowrule-31
  float = on
  center = on
  border_color = rgba(255,255,255,1) rgba(255,255,0,1)
  border_size = 5
  rounding = 10
  rounding_power = 3
  match:title = SteamVR Status
  opacity = 1.0 override 1.0 override 1.0 override
}
#removes the border and noise from the vr pop-ups
windowrule {
  name = windowrule-32
  float = on
  center = off
  no_blur=on
  border_color = 000000
  opacity = 1.0 override 1.0 override 1.0 override
  match:title = vrmonitor
  match:class = vrmonitor
}
#blurs both waybars and swaync -t
layerrule{
	name = layerrule-1
	match:namespace = ^(.*bar.*)$|^(.*swaync-control-center.*)$
	blur = on
	ignore_alpha = 0.1
}

#removes black border from hyprshot picture
layerrule{
	name = layerrule-2
	match:namespace = selection
	no_anim = on
}
layerrule{
	name = layerrule-3
	match:namespace = swaync-control-center
	animation = slidefadevert top
}
layerrule{
	name = layerrule-4
	match:namespace = swaync-notification-window
	animation = slidefadevert bottom
}
#makes yast password small and floating
windowrule {
  name = windowrule-33
  float = on
  center = on
  match:title = xdg-su: /sbin/yast2
  match:class = XTerm
  size = 200 100
  
}



