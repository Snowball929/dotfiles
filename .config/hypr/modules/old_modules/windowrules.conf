##############################
### WINDOWS AND WORKSPACES ###
##############################
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules



#tags gamescope as game
windowrule {
  name = windowrule-1
  tag = +games
  match:class = ^(gamescope)$|^(steam_app_\d+)$|^(steam_proton)$
}
#tags mincraft as game
windowrule {
  name = windowrule-3
  tag = +games
  match:title = ^(Minecraft.*)$
}
#moves retroarch games to workspace 2
windowrule {
  name = windowrule-3-2
  tag = +games
  match:title = ^RetroArch .+$
}
#moves main retroarch window to workspace 1
windowrule {
  name = windowrule-3-3
  workspace = 1
  fullscreen = true
  match:title = ^RetroArch$
}


#moves azahar window to workspace 2 and fullscreen
windowrule {
  name = windowrule-3-4
  fullscreen = true
  workspace = 2
  match:title = ^Azahar 2125.1.1$
}
#makes azahar banners opaque
windowrule {
  name = windowrule-3-5
  opacity = 1 override 1 override 1 override
  match:title = ^Azahar$
}

