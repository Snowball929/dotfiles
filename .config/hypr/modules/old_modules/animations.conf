animations {
    enabled = yes
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    
#from that one youtube video
    bezier = smoothOut,   0.36, 0, 0.66, -0.56
    bezier = smoothIn,   0.25, 1, 0.5, 1
    bezier = overshot,   0.05, 0.9, 0.1, 1.05
    bezier = softSnap,   0.4, 0, 0.2, 1
    bezier = fluent,   0.0, 0.0, 0.2, 1
    bezier = easeInOutExpo,   0.87, 0, 0.13, 1
    
#   Windows 
    animation = windows,       1, 3,  overshot, popin 80%
    animation = windowsIn,     1, 3,  overshot, popin 80%
    animation = windowsOut,    1, 3,  smoothOut,       popin 0%
    animation = windowsMove,    1, 3, softSnap
    
#	Layers
    animation = layersIn,      1, 3, smoothIn, popin 92%
    animation = layersOut,     1, 3, softSnap
    
#	Fade
    animation = fade,          1, 4,  smoothIn
    animation = fadeIn,        1, 4,  smoothIn
    animation = fadeOut,       1, 4,  smoothOut
    animation = fadeSwitch,       1, 4,  smoothIn
    animation = fadeShadow,       1, 46,  smoothIn
    animation = fadeDim,       1, 4,  smoothIn
    animation = fadeDpms,       1, 4,  smoothIn
    animation = fadeLayers,       1, 3,  softSnap
    
#	Workspaces
    animation = workspaces,    1,     3,  	 easeInOutCubic, slidefadevert
	animation = workspacesIn,  1,     2.21,  easeInOutCubic, slide
	animation = workspacesOut, 1,     2.21,  easeInOutCubic, slide
    animation = specialWorkspace,    1, 5, overshot, slidefadevert
}

