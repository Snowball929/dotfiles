#mouse preset 1 2400 dpi purple-top and red-bottom
#mouse preset 2 800 dpi blue-top and bottom 
autogenerated = 0 # remove this line to remove the warning

######################
### IMPORT MODULES ###
######################
$modules = ~/.config/hypr/modules

source = $modules/opacity.conf
source = $modules/windowrules.conf
source = $modules/binds.conf
source = $modules/animations.conf
source = $modules/input.conf
source = $modules/looks.conf
source = $modules/layout.conf

################
### MONITORS ###
################
monitor=HDMI-A-1,1920x1080@75,0x0,1
monitor=DP-1,2560x1440@144,1920x0,1, vrr, 0

#################
### AUTOSTART ###
#################
#exec-once = $terminal
#exec-once = nm-applet &
#exec-once = /usr/lib/polkit-kde-authentication-agent-1
#exec-once = systemctl --user start hyprpolkitagent
#exec-once = systemctl --user start hyprpolkitagent.service

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

exec-once = /usr/libexec/hyprpolkitagent
exec-once = swaync
exec-once = waybar & awww-daemon
exec-once = steam
exec-once = kitty
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = hypridle
exec-once = ~/appImages/Vesktop-1.6.5.AppImage
exec-once = kwalletd6&
exec-once = otd-daemon
exec-once = balooctl6 enable

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
#############################
### ENVIRONMENT VARIABLES ###
#############################
env = HYPRCURSOR_THEME,Bibata-Modern-Classic 
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic 
env = XCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct


env = HYPRSHOT_DIR, /home/snow/Pictures/Screenshots

env = LIBVA_DRIVER_NAME,nvidia
env = __GL_GSYNC_ALLOWED
env = EZA_COLORS="da=32"


###################
### PERMISSIONS ###
###################

