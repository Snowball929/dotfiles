#mouse preset 1 2400 dpi purple-top and red-bottom
#mouse preset 2 800 dpi blue-top and bottom

source=~/.config/mango/binds.conf
source=~/.config/mango/rules.conf

# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
# exec-once = /usr/libexec/hyprpolkitagent
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = xrandr --output DP-1 --primary
exec-once = swaync
exec-once = waybar -c ~/.config/waybar/configMango.jsonc -s ~/.config/waybar/styleMango.css
exec-once = awww-daemon
exec-once = steam
exec-once = kitty
exec-once = hypridle
exec-once = ~/appImages/Vesktop-1.6.5.AppImage
exec-once = kwalletd6&
exec-once = otd-daemon
exec-once = balooctl6 enable
exec-once = xrandr --output DP-1 --primary
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec-once = dbus-update-activation-environment --systemd --all
# env=HYPRSHOT_DIR, /home/snow/Pictures/Screenshots

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 2
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.696

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 10
shadows_position_x = 10
shadows_position_y = 10
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=fade

layer_animation_duration_open=200
layer_animation_duration_close=200

animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=350
animation_duration_close=200
animation_duration_focus=200
animation_curve_open=0.4,0,0.2,1
animation_curve_move=0.4,0,0.2,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.25,1,0.5,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=2
enable_hotarea=0
hotarea_corner=2
ov_tab_mode=1
ov_no_resize=0
overviewgappi=10
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0
# syncobj_enable=1

drag_warp_cursor=1
exchange_cross_monitor=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.1

# Appearance / Theme / Looks
gappih=8
gappiv=8
gappoh=15
gappov=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x1f003dff
bordercolor=0x26234844 #262348
focuscolor=0xb7b2ffff
dropcolor=0x26153222
splitcolor=0xEB441EFF
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

