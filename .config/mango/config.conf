#Main Mango Config
#mouse preset 1 2400 dpi purple-top and red-bottom
#mouse preset 2 800 dpi blue-top and bottom
auto_reload_config=0
source=~/.config/mango/binds.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/monitors.conf

# More option see https://github.com/DreamMaoMao/mango/wiki/
exec_once = wl-paste --type text --watch cliphist store # Stores only text data
exec_once = wl-paste --type image --watch cliphist store # Stores only image data
exec_once = /usr/libexec/polkit-kde-authentication-agent-1
exec_once = xrandr --output DP-1 --primary
exec_once = swaync
exec_once = waybar -c ~/.config/waybar/configMango.jsonc -s ~/.config/waybar/styleMango.css
exec_once = awww-daemon
exec_once = LIBVA_DRIVER_NAME=invalid steam
exec_once = kitty
exec_once = hypridle
exec_once = ~/appImages/Vesktop-1.6.9.AppImage
exec_once = kwalletd6&
exec_once = otd-daemon
exec_once = balooctl6 enable
exec_once = xrandr --output DP-1 --primary
# exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec_once = dbus-update-activation-environment --systemd --all
# env=HYPRSHOT_DIR, /home/snow/Pictures/Screenshots

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 2
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.696

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 10
shadows_position_x = 10
shadows_position_y = 10
shadows_color= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=fade


animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=350
animation_duration_close=200
animation_duration_focus=200
animation_curve_open=0.4,0,0.2,1
animation_curve_move=0.4,0,0.2,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.25,1,0.5,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=2
enable_hotarea=0
hotarea_corner=2
#ov_tab_mode=1
overview_gap_inner=10
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0
# sync_obj_enable=1

drag_warp_cursor=1
exchange_cross_monitor=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.1

# Appearance / Theme / Looks
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=15
gap_outer_vertical=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3
root_color=0x1f003dff
border_color=0x444444ff
focus_color=0xb7b2ffff
drop_color=0x26153222
split_color=0xEB441EFF
maximized_screen_color=0xA6E3A1ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

