

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=Alt,r,reload_config

# menu and terminal
bind=Super+Shift,R,spawn,wofi --show drun
bind=Super,R,spawn,rofi -show drun -theme /home/snow/Documents/myRofiLauncher.rasi -icon-theme "Papirus" -show-icons -display-drun "Apps" -drun-display-format "{name}"
bind=Super,Q,spawn,kitty
bind=Super,F,spawn,firefox
bind=Super,E,spawn,dolphin --platformtheme kde
#bind=Super,V,spawn_shell,cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy && wtype -M ctrl -k v -m ctrl
bind=Super,V,spawn_shell,cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy 
# exit
# bind=SUPER+shift,m,quit
bind=Super,c,killclient,
bind=Super,z,spawn,swaync-client -t -sw

bind=Super,bracketright,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | tee /home/snow/Pictures/Screenshots/$(date +%Y-%m-%d_%H:%M:%S).png | wl-copy
bind=Super+Shift,s,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | tee /home/snow/Pictures/Screenshots/$(date +%Y-%m-%d_%H:%M:%S).png | wl-copy
bind=NONE,Print,spawn,$HOME/.config/mango/scripts/screenshot/freeze.sh


windowrule=globalkeybinding:super+t-ctrl+shift+m,appid:vesktop
windowrule=globalkeybinding:super+equals-super+equals,appid:com.obsproject.Studio

# switch window focus
# bind=SUPER,Tab,focusstack,next
bind=super,j,focusdir,left
bind=super,l,focusdir,right
bind=super,i,focusdir,up
bind=super,k,focusdir,down

# swap window
bind=super,Up,exchange_client,up
bind=super,Down,exchange_client,down
bind=super,Left,exchange_client,left
bind=super,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
# bind=ALT,Tab,toggleoverview,
bind=ALT,Tab,togglejump
bind=SUPER,G,groupjoin,left
bind=ALT,backslash,togglefloating,
# bind=ALT,a,togglemaximizescreen,
bind=super,x,togglefullscreen,
bind=super+shift,x,togglemaximizescreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
# bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
circle_layout=tile,right_tile
bind=SUPER,n,switch_layout

# tag switch
bind=alt,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
bind=alt,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=super,1,viewcrossmon,1,DP-1
bind=super,2,viewcrossmon,2,DP-1
bind=super,3,viewcrossmon,3,HDMI-A-1
bind=super,4,viewcrossmon,4,HDMI-A-1
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-1
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-1
bind=SUPER+SHIFT,3,tagcrossmon,3,HDMI-A-1
bind=SUPER+SHIFT,4,tagcrossmon,4,HDMI-A-1
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

#toggle tag
bind=alt+SHIFT,1,toggletag,1,0
bind=alt+SHIFT,2,toggletag,2,0
bind=alt+SHIFT,3,toggletag,3,0
bind=alt+SHIFT,4,toggletag,4,0
bind=alt+SHIFT,5,toggletag,5,0
bind=alt+SHIFT,6,toggletag,6,0
bind=alt+SHIFT,7,toggletag,7,0
bind=alt+SHIFT,8,toggletag,8,0
bind=alt+SHIFT,9,toggletag,9,0

bind=super,F1,toggletag,1,0
bind=super,F2,toggletag,2,0
bind=super,F3,toggletag,3,0
bind=super,F4,toggletag,4,0
bind=super,F5,toggletag,5,0
bind=super,F6,toggletag,6,0
bind=super,F7,toggletag,7,0
bind=super,F8,toggletag,8,0
bind=super,F9,toggletag,9,0

# # monitor switch
# bind=alt+shift,Left,focusmon,left
# bind=alt+shift,Right,focusmon,right
# bind=SUPER+Alt,Left,tagmon,left
# bind=SUPER+Alt,Right,tagmon,right
bind=SUPER,space,tagmon,left
bind=SUPER,tab,focusmon,left
bind=SUPER+SHIFT,space,tagmon,left
#
# # gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps


# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0

bind=SUPER+ALT,i,resizewin,+0,-50
bind=SUPER+ALT,k,resizewin,+0,+50
bind=SUPER+ALT,j,resizewin,-50,+0
bind=SUPER+ALT,l,resizewin,+50,+0
# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

windowrule=globalkeybinding:ctrl+shift-m,appid:vesktop
windowrule=globalkeybinding:super-equal,appid:com.obsproject.Studio
# bind=SUPER,backslash,spawn, wtype -d 2000 -M ctrl -M shift m

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


bind=NONE,XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bind=NONE,XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bind=NONE,XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind=SHIFT,XF86AudioMute, spawn, ~/Documents/scripts/pactlScript.sh
bind=SUPER,M, spawn, ~/Documents/scripts/pactlScript.sh
bind=SUPER+SHIFT,M, spawn, ~/Documents/scripts/pactlScript.sh
bind=SUPER,XF86AudioMute, spawn, ~/Documents/scripts/pactlScript.sh

bind=super,backslash, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
